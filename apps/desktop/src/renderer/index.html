<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Deskto</title>
    <!--
      The palette has to be on the document before the first paint, which is
      earlier than any bundled module runs — hence a copy of the boot logic
      inline. `dark` on <html> above is only what this runs against; it is
      corrected below, and again from the Runtime's answer once React mounts.
      Keep the storage key in step with lib/theme.ts.
    -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem("deskto.appearance.theme")
          var dark =
            stored === "dark" ||
            (stored !== "light" &&
              matchMedia("(prefers-color-scheme: dark)").matches)
          document.documentElement.classList.toggle("dark", dark)
          document.documentElement.style.colorScheme = dark ? "dark" : "light"
        } catch (error) {
          // No storage, no preference to honour: the markup's `dark` stands,
          // and `color-scheme` has to be said out loud to match it now that
          // the stylesheet no longer pins one.
          document.documentElement.style.colorScheme = "dark"
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
