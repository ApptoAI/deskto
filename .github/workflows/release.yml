name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  preflight:
    name: Resolve release
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - id: release
        name: Set release metadata
        shell: bash
        run: |
          version="0.1.${GITHUB_RUN_NUMBER}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  quality:
    name: Verify release candidate
    needs: preflight
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  build_macos:
    name: Build macOS
    needs: [preflight, quality, build_linux, build_windows]
    runs-on: blacksmith-6vcpu-macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set application version
        run: node .github/scripts/set-desktop-version.mjs "${{ needs.preflight.outputs.version }}"

      - name: Prepare Apple signing
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          required=(APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER CSC_LINK CSC_KEY_PASSWORD)
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing repository secret: $name" >&2
              exit 1
            fi
          done

          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key_path"
          certificate_path="$RUNNER_TEMP/deskto-developer-id.p12"
          printf '%s' "$CSC_LINK" | base64 -D > "$certificate_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"
          echo "CSC_LINK=$certificate_path" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=$CSC_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Check Apple notarization queue
        run: |
          history_path="$RUNNER_TEMP/notary-history.json"
          xcrun notarytool history \
            --key "$APPLE_API_KEY" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --output-format json > "$history_path"

          NOTARY_HISTORY_PATH="$history_path" node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs"

          const result = JSON.parse(
            readFileSync(process.env.NOTARY_HISTORY_PATH, "utf8")
          )
          const pending = Array.isArray(result.history)
            ? result.history.filter((submission) => submission.status === "In Progress")
            : []
          if (pending.length > 0) {
            console.error(
              `Apple is still processing ${pending.length} earlier notarization submission(s). Try the release again after they finish.`
            )
            process.exit(1)
          }
          NODE

      - name: Build, sign, and notarize
        run: |
          pnpm --filter @deskto/desktop build
          pnpm --dir apps/desktop exec electron-builder \
            --config electron-builder.config.ts \
            --mac \
            --arm64 \
            --x64 \
            --publish never

      - name: Verify macOS update assets
        shell: bash
        run: |
          test -s apps/desktop/release/latest-mac.yml
          compgen -G 'apps/desktop/release/*.dmg' > /dev/null
          compgen -G 'apps/desktop/release/*.blockmap' > /dev/null

          archives=(apps/desktop/release/*.zip)
          if [[ ! -e "${archives[0]}" || ${#archives[@]} -ne 2 ]]; then
            echo "Expected one macOS ZIP for each architecture." >&2
            exit 1
          fi
          for archive in "${archives[@]}"; do
            grep -Fq "$(basename "$archive")" apps/desktop/release/latest-mac.yml
          done

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: deskto-macos
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest-mac.yml
          if-no-files-found: error
          retention-days: 14

  build_windows:
    name: Build Windows x64
    needs: [preflight, quality, build_linux]
    runs-on: blacksmith-4vcpu-windows-2025
    timeout-minutes: 30
    env:
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      WINDOWS_SIGNING_ENDPOINT: ${{ vars.WINDOWS_SIGNING_ENDPOINT }}
      WINDOWS_SIGNING_ACCOUNT_NAME: ${{ vars.WINDOWS_SIGNING_ACCOUNT_NAME }}
      WINDOWS_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ vars.WINDOWS_SIGNING_CERTIFICATE_PROFILE_NAME }}
      WINDOWS_SIGNING_PUBLISHER_NAME: ${{ vars.WINDOWS_SIGNING_PUBLISHER_NAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - id: windows_signing
        name: Configure Windows signing
        shell: bash
        run: |
          required=(
            AZURE_TENANT_ID
            AZURE_CLIENT_ID
            AZURE_CLIENT_SECRET
            WINDOWS_SIGNING_ENDPOINT
            WINDOWS_SIGNING_ACCOUNT_NAME
            WINDOWS_SIGNING_CERTIFICATE_PROFILE_NAME
            WINDOWS_SIGNING_PUBLISHER_NAME
          )
          configured=0
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            else
              configured=$((configured + 1))
            fi
          done

          if (( configured == 0 )); then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Windows signing is not configured; building an unsigned installer."
          elif (( configured == ${#required[@]} )); then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Windows signing enabled (Microsoft Artifact Signing)."
          else
            echo "Windows signing is partially configured. Missing: ${missing[*]}" >&2
            exit 1
          fi

      - name: Set application version
        run: node .github/scripts/set-desktop-version.mjs "${{ needs.preflight.outputs.version }}"

      - name: Build Windows package
        shell: bash
        run: |
          pnpm --filter @deskto/desktop build
          pnpm --dir apps/desktop exec electron-builder \
            --config electron-builder.config.ts \
            --win \
            --x64 \
            --publish never

      - name: Verify Windows package
        shell: pwsh
        env:
          WINDOWS_SIGNING_ENABLED: ${{ steps.windows_signing.outputs.enabled }}
        run: |
          $installers = @(Get-ChildItem "apps/desktop/release" -Filter "*.exe")
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows installer, found $($installers.Count)."
          }

          $installer = $installers[0]
          if ($env:WINDOWS_SIGNING_ENABLED -eq "true") {
            $signature = Get-AuthenticodeSignature $installer.FullName
            if ($signature.Status -ne "Valid") {
              throw "$($installer.Name) does not have a valid signature: $($signature.Status)"
            }
          } else {
            Write-Host "Windows signing is not configured; accepting the unsigned installer."
          }

          $feed = "apps/desktop/release/latest.yml"
          if (-not (Test-Path $feed -PathType Leaf)) {
            throw "The Windows update feed was not created."
          }
          if ((Get-Item $feed).Length -eq 0) {
            throw "The Windows update feed is empty."
          }
          if (-not (Select-String -Path $feed -SimpleMatch $installer.Name -Quiet)) {
            throw "The Windows update feed does not reference $($installer.Name)."
          }

          $blockmap = "$($installer.FullName).blockmap"
          if (-not (Test-Path $blockmap -PathType Leaf)) {
            throw "The Windows update blockmap was not created."
          }

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: deskto-windows-x64
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest.yml
          if-no-files-found: error
          retention-days: 14

  build_linux:
    name: Build Linux x64
    needs: [preflight, quality]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.sha }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.18.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set application version
        run: node .github/scripts/set-desktop-version.mjs "${{ needs.preflight.outputs.version }}"

      - name: Build
        run: |
          pnpm --filter @deskto/desktop build
          pnpm --dir apps/desktop exec electron-builder \
            --config electron-builder.config.ts \
            --linux \
            --x64 \
            --publish never

      - name: Verify Linux update assets
        shell: bash
        run: |
          test -s apps/desktop/release/latest-linux.yml
          test -s apps/desktop/release/Deskto.AppImage
          grep -Fq "Deskto.AppImage" apps/desktop/release/latest-linux.yml

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: deskto-linux-x64
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/latest-linux.yml
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: [preflight, build_macos, build_windows, build_linux]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: deskto-*
          merge-multiple: true
          path: release-assets

      - name: Verify complete release
        shell: bash
        run: |
          test -s release-assets/latest-mac.yml
          test -s release-assets/latest.yml
          test -s release-assets/latest-linux.yml
          test -s release-assets/Deskto.AppImage
          compgen -G 'release-assets/*.dmg' > /dev/null
          compgen -G 'release-assets/*.zip' > /dev/null
          compgen -G 'release-assets/*.exe' > /dev/null
          compgen -G 'release-assets/*.blockmap' > /dev/null

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.preflight.outputs.tag }}
          target_commitish: ${{ needs.preflight.outputs.sha }}
          name: Deskto ${{ needs.preflight.outputs.tag }}
          generate_release_notes: true
          draft: true
          prerelease: false
          make_latest: false
          files: release-assets/*
          fail_on_unmatched_files: true

      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
